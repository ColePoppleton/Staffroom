name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    name: check
    # Linux minutes cost a tenth of macOS ones on a private repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Qt system libraries (offscreen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3 fonts-dejavu-core
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: QT_QPA_PLATFORM=offscreen uv run pytest -q
