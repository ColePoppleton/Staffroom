name: Install line

# Runs the install command the docs home page tells colleagues to use (#80),
# so a wrong or unpublished install line fails here instead of on a teacher's Mac.
# Since #11 that line installs from @main (the released branch), so
# `uv tool upgrade staffroom` is the one-command update; the job installs
# what main holds on GitHub, not this commit (the wheel job tests this commit).
# The tests (tests/test_install_docs.py) separately refuse a PyPI-only line.
# An installed copy must never run git in a repository that happens to enclose
# its tool folder (#9): both jobs install inside a throwaway git repository
# with a remote and check that repository is left alone.

on:
  push:
    branches: [main, dev]
    paths:
      - "README.md"
      - "docs/index.md"
      - "docs/guide/install.md"
      - "pyproject.toml"
      - "src/staffroom/core/install.py"
      - "src/staffroom/core/update.py"
      - "tests/test_installed_copy.py"
      - ".github/workflows/install-line.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/index.md"
      - "docs/guide/install.md"
      - "pyproject.toml"
      - "src/staffroom/core/install.py"
      - "src/staffroom/core/update.py"
      - "tests/test_installed_copy.py"
      - ".github/workflows/install-line.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: documented install line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the install line from docs/index.md in a throwaway tool dir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pattern='^uv tool install --python 3\.12 git\+https://github\.com/ColePoppleton/Staffroom@main$'
          line=$(grep -m1 -E "$pattern" docs/index.md) || {
            echo "docs/index.md has no line matching: $pattern"; exit 1; }
          echo "Running: $line"
          # The repository is private: let git (which uv uses) clone with the job token.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          # A home folder kept as a git repository, with a remote: the tool goes inside it.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid
          home="$RUNNER_TEMP/home"
          git init -q --bare -b main "$RUNNER_TEMP/dotfiles.git"
          git init -q -b main "$home"
          echo "# fake" > "$home/.zshrc"
          git -C "$home" add .zshrc
          git -C "$home" commit -q -m one
          git -C "$home" remote add origin "$RUNNER_TEMP/dotfiles.git"
          git -C "$home" push -q -u origin main
          head=$(git -C "$home" rev-parse HEAD); reflog=$(git -C "$home" reflog)
          export UV_TOOL_DIR="$home/.local/share/uv/tools" UV_TOOL_BIN_DIR="$home/.local/bin"
          export STAFFROOM_HOME="$RUNNER_TEMP/staffroom-home"
          cd "$home"
          eval "$line"
          "$UV_TOOL_BIN_DIR/staff" version
          "$UV_TOOL_BIN_DIR/staff" update --check
          # The one-command update the Updates card shows must run on this install.
          uv tool upgrade staffroom
          test "$(git -C "$home" rev-parse HEAD)" = "$head"
          test "$(git -C "$home" reflog)" = "$reflog"

  wheel:
    name: built wheel inside a git repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Install this commit's wheel with uv; staff update must not touch the repository
        env:
          STAFFROOM_WHEEL_TEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q tests/test_installed_copy.py
