name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing, when the PYPI_PUBLISH repo variable is "true"

jobs:
  # The Mac app, built and smoke-tested (#60). If it fails, nothing below runs:
  # no GitHub Release, no wheel, never an app that failed its smoke test.
  bundle:
    uses: ./.github/workflows/bundle.yml
    permissions:
      contents: read

  release:
    needs: [bundle]
    # Staffroom targets macOS; macOS runners are free on a public repository.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: QT_QPA_PLATFORM=offscreen uv run pytest -q
      - name: Tag must match pyproject
        run: |
          v=$(uv run python scripts/release.py version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      # Builds the sdist, then the wheel from the sdist: what PyPI and the Release page get.
      - run: uv build
      - name: The tests pass from the sdist (#22)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          sdist="$RUNNER_TEMP/sdist"
          mkdir -p "$sdist"
          tar xzf dist/*.tar.gz -C "$sdist" --strip-components 1
          # Same dependencies as the checkout's run above; the lock is not shipped.
          cp uv.lock "$sdist/"
          cd "$sdist"
          uv sync --locked
          uv run pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: app  # not dist/: uv publish uploads everything in dist/ to PyPI
      - name: Release notes from CHANGELOG.md
        run: uv run python scripts/release.py notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ZIP: app/${{ needs.bundle.outputs.asset }}
        run: |
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz "$APP_ZIP" --title "$GITHUB_REF_NAME" --notes-file notes.md $extra
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true' && !contains(github.ref_name, '-')
        run: uv publish --trusted-publishing always
