name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # PyPI trusted publishing, when the PYPI_PUBLISH repo variable is "true"

jobs:
  release:
    # Staffroom targets macOS; macOS runners are free on a public repository.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: QT_QPA_PLATFORM=offscreen uv run pytest -q
      - name: Tag must match pyproject
        run: |
          v=$(uv run python scripts/release.py version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: uv run python scripts/release.py notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --title "$GITHUB_REF_NAME" --notes-file notes.md $extra
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true' && !contains(github.ref_name, '-')
        run: uv publish --trusted-publishing always
