repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # The bundled OFL fonts (#89): Source Sans 3's variable TTF is 631 KB
        # and must ship unmodified (the licence reserves the name).
        exclude: '^src/staffroom/shell/assets/fonts/.*\.ttf$'
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-real-pupil-data
        name: refuse CSV/XLSX files without a fake-data marker
        entry: uv run python scripts/check_fake_data.py
        language: system
        files: '\.(csv|xlsx)$'
        pass_filenames: true
