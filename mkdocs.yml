site_name: Staffroom
site_description: Small tools for secondary computing teachers, with no pupil data.
site_url: https://colepoppleton.github.io/Staffroom/
repo_url: https://github.com/ColePoppleton/Staffroom
repo_name: ColePoppleton/Staffroom
edit_uri: edit/dev/docs/
copyright: MIT licensed.

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  # Fonts come from docs/stylesheets/brand.css (Fraunces for headings, Source
  # Sans 3 for body) so Material does not also load Roboto.
  font: false
  features:
    # Top-level nav entries become tabs in the header (Home, Install, Tools,
    # Privacy, Guides, Contributing), so the home page can hide the sidebar.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra:
  # Staffroom is not on PyPI. While this is false, tests/test_install_docs.py
  # fails if the docs or README tell anyone to install it by name (which would
  # fail, or fetch a stranger's package if the name is ever taken). Set it to
  # true only after the package is actually published.
  published_on_pypi: false

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  # The home page includes a real pseudocode translation written by
  # scripts/screenshots.sh; a missing file fails the build.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

# Planning notes stay in the repository but are not part of the site.
exclude_docs: |
  audits/
  ROADMAP.md
  PHASES.md

nav:
  # Teachers' pages first; everything about building Staffroom is under
  # Contributing, last.
  - Home: index.md
  - Install: guide/install.md
  - Tools:
      # The app's sidebar order (#89): Lessons, Sheets & quizzes, From a
      # program, After a test.
      - Using the launcher: guide/launcher.md
      - Resource Library: tools/library.md
      - Classroom: tools/classroom.md
      - Worksheet: tools/worksheet.md
      - Quiz: tools/quiz.md
      - Parsons: tools/parsons.md
      - Trace: tools/trace.md
      - Bugs: tools/bugs.md
      - Fade: tools/fade.md
      - Pseudocode: tools/pseudocode.md
      - Marks: tools/marks.md
  - Privacy: guide/privacy.md
  - Guides:
      - Outputs: guide/outputs.md
      - Running pupil code: guide/running-code.md
      - Updating: guide/updating.md
      - Glossary: guide/glossary.md
      - Formats:
          - Question banks: guide/question-banks.md
          - Marks files: guide/marks-files.md
          - House style: guide/house-style.md
      - Changelog: changelog.md
  - Contributing:
      - How to contribute: contributing.md
      - Adding a tool: adding-a-tool.md
