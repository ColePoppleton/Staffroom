[project]
name = "teaching-tools"
version = "0.1.0"
description = "A launcher of small Python tools for a UK secondary computing teacher."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyside6>=6.7",
    "openpyxl>=3.1",
    "tomli-w>=1.0",
    "pypdf>=6.19.0",
]

[project.scripts]
tt = "teaching_tools.cli:main"
tt-gui = "teaching_tools.shell.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "import-linter>=2.0",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teaching_tools"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["Marks Calculator - Student Complexity version"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "TID"]
ignore = ["RUF012", "RUF001"]  # RUF001: we like × and … in UI text

[tool.ruff.lint.per-file-ignores]
"src/teaching_tools/tools/*/tests/*" = ["S101"]
"tests/*" = ["S101"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "src/teaching_tools/tools"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = ["error::DeprecationWarning:teaching_tools.*"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["teaching_tools"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "teaching_tools.core.*"
strict = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "teaching_tools"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Tools never import Qt or the shell"
type = "forbidden"
source_modules = ["teaching_tools.tools", "teaching_tools.core", "teaching_tools.cli"]
forbidden_modules = ["PySide6", "shiboken6", "teaching_tools.shell"]

[[tool.importlinter.contracts]]
name = "Core knows nothing about tools or the CLI"
type = "forbidden"
source_modules = ["teaching_tools.core"]
forbidden_modules = ["teaching_tools.tools", "teaching_tools.cli", "typer"]
