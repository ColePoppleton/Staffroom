# Pearson Edexcel GCSE (9-1) Computer Science 1CP2 — content map.
# Codes and subtopics are the specification's own (Topics 1-6); titles are short
# forms of each point's wording. Built from the document named in [source]; if
# Pearson publishes a later issue, check the codes and titles against it.
board = "edexcel"
title = "Pearson Edexcel 1CP2"

